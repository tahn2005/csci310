plugins {
    id 'com.android.application'
}

// Backend (see README.md):
//  * By default the app keeps its data in a database on the device, so it runs from Android
//    Studio with no setup.
//  * If app/google-services.json exists, it connects to that Firebase project instead.
// Optional settings in local.properties:
//   firebase.useEmulator=true            use the Firebase Local Emulator Suite
//   firebase.emulatorHost=10.0.2.2       where the emulator runs (10.0.2.2 = this computer)
//   places.apiKey=<Google Places API key>   (optional; OpenStreetMap is used when blank)
def googleServicesFile = file('google-services.json')
if (googleServicesFile.exists()) {
    apply plugin: 'com.google.gms.google-services'
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def useEmulator = (localProps.getProperty('firebase.useEmulator') ?: 'false').toBoolean()
def emulatorHost = localProps.getProperty('firebase.emulatorHost', '10.0.2.2')
def placesKey = localProps.getProperty('places.apiKey', '')

android {
    namespace = 'com.team23.trojanrideshare'
    compileSdk = 34

    defaultConfig {
        applicationId = 'com.team23.trojanrideshare'
        minSdk = 26
        targetSdk = 34
        versionCode = 1
        versionName = '1.0'


        buildConfigField 'boolean', 'USE_FIREBASE_EMULATOR', useEmulator.toString()
        buildConfigField 'String', 'FIREBASE_EMULATOR_HOST', "\"${emulatorHost}\""
        buildConfigField 'String', 'PLACES_API_KEY', "\"${placesKey}\""
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.6.2'

    // Firebase (Auth Gateway + Firestore repositories)
    implementation platform('com.google.firebase:firebase-bom:33.5.1')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'

    // Google Places SDK (Location Gateway, used when places.apiKey is set)
    implementation 'com.google.android.libraries.places:places:3.5.0'
}
